name: Test application

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner on which to run this script
        required: true
        type: string
      create-artifact:
        description: True to allow the workflow to create a build artifact
        required: false
        default: false
        type: boolean
    secrets:
      personal_access_token:
        required: false

jobs:
  setup_frontend:
    name: Setup Frontend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
      - run: npm install
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node_modules
  lint_frontend:
    name: Lint Frontend
    needs: setup_frontend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node_modules
          fail-on-cache-miss: true
      - run: npm run lint
  test_frontend:
    name: Test Frontend
    needs: setup_frontend
    runs-on: ${{ inputs.runs-on }}
    if: false
    steps:
      - uses: actions/checkout@v6
      # TODO: Figure out testing for frontend
  build_frontend:
    name: Build Frontend
    needs: setup_frontend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node_modules
          fail-on-cache-miss: true
      - run: npm run build
      - uses: actions/cache@v5
        with:
          path: www
          key: www


  setup_backend:
    name: Setup Backend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
      - run: uv venv
      - run: uv sync
      - uses: actions/cache@v5
        with:
          path: .venv
          key: .venv
  lint_backend:
    name: Lint Backend
    needs: setup_backend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .venv
          key: .venv
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
  test_backend:
    name: Test Backend
    needs: setup_backend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .venv
          key: .venv
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
      - run: pytest
  build_backend:
    name: Build backend
    needs: [setup_backend, build_frontend]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .venv
          key: .venv
          fail-on-cache-miss: true
      - uses: actions/cache@v5
        with:
          path: www
          key: www
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
      - run: pyinstaller onedir.spec

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.create-artifact }}
        with:
          name: nsobridge-${{ runner.os }}
          path: ./dist

