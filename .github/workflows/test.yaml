name: Test, Lint, and Build
on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner on which to run this script
        required: true
        type: string
      create-artifact:
        description: True to allow the workflow to create a build artifact
        required: false
        default: false
        type: boolean
      test-release:
        description: True to ensure that release testing is performed
        required: false
        default: false
        type: boolean
    secrets:
      personal_access_token:
        required: false

jobs:
  setup_frontend:
    name: Setup Frontend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
      - run: npm install
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules
  lint_frontend:
    name: Lint Frontend
    needs: setup_frontend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules
          fail-on-cache-miss: true
      - run: npm run lint
  test_frontend:
    name: Test Frontend
    needs: setup_frontend
    runs-on: ${{ inputs.runs-on }}
    if: false
    steps:
      - uses: actions/checkout@v6
      # TODO: Figure out testing for frontend
  build_frontend:
    name: Build Frontend
    needs: setup_frontend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules
          fail-on-cache-miss: true
      - run: npm run build
      - uses: actions/cache@v5
        with:
          path: www
          key: ${{ runner.os }}-www

  setup_backend:
    name: Setup Backend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
      - run: uv venv
      - run: uv sync
      - uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-.venv
  lint_backend:
    name: Lint Backend
    needs: setup_backend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-.venv
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
  test_backend:
    name: Test Backend
    needs: [setup_backend, build_frontend]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-.venv
      - uses: actions/cache@v5
        with:
          path: www
          key: ${{ runner.os }}-www
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
      - run: pytest backend/tests --tag-name ${{ github.ref_name }}
        if: ${{ inputs.test-release }}
      - run: pytest
        if: ${{ !inputs.test-release }}
  build_backend:
    name: Build backend
    needs: [setup_backend, build_frontend]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-.venv
          fail-on-cache-miss: true
      - uses: actions/cache@v5
        with:
          path: www
          key: ${{ runner.os }}-www
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
      - run: pyinstaller onedir.spec
      - uses: actions/cache@v5
        with:
          path: dist
          key: ${{ runner.os }}-dist

  create-artifact:
    name: Create artifact
    if: ${{ inputs.create-artifact }}
    needs: build_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v5
        with:
          path: dist
          key: ${{ inputs.runs-on }}-dist
          fail-on-cache-miss: true
      - name: Remove unused folder on MacOS
        if: ${{ inputs.runs-on == 'macos-latest' }}
        run: rm -rf "dist/NSO Bridge/"
      - uses: actions/upload-artifact@v4
        with:
          name: nsobridge-${{ inputs.runs-on }}
          path: "dist/NSO Bridge/*"
