# Lint, test, and build the application.
#
# This workflow runs when a a commit is pushed. It sets up the programming environment
# and runs linting, testing, and build scripts. 
name: Lint, Test, and Build

on: push

jobs:
  setup_environment:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Setup the Node.js frontend
      - name: Install Node.js
        uses: actions/setup-node@v4
      - name: Install Node.js dependencies
        run: npm install

      # Setup the Python backend
      - name: Install Astral uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"
      - name: Setup python virtual environment
        run: uv venv
      - name: Install python dependencies
        run: uv sync

  lint_frontend:
    name: Lint Frontend
    needs: setup_environment
    steps:
      - name: Run linter scripts
        run: npm run lint
 
  test_frontend:
    name: Test Frontend
    needs: setup_environment
    if: false  # TODO: add frontend testing
  build_frontend:
    name: Build Backend
    needs: setup_environment
    steps:
      - name: Run build scripts
        run: npm run lint

  lint_backend:
    name: Lint Backend
    needs: setup_environment
    steps:
      - name: Ruff check
        run: ruff check . --ignore EXE001
      - name: Ty check
        run: ty check
  test_backend:
    name: Test Backend
    needs: setup_environment
    steps:
      - name: Run pytest
        run: pytest
  build_backend:
    name: Build Backend
    needs: [setup_environment, build_frontend]
    steps:
      - name: Bundle application with PyInstaller
        run: pyinstaller ./onedir.spec -y
