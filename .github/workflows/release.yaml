# Generate a Github release for the application.
#
# This workflow runs when a new tag is pushed to Github. The tag must be a semver
# identifier that matches `vX.Y.Z`. To fire this script, generate a new tag matching
# that pattern and push it to the remote. The release is generated as a draft with 
# automatically generated release notes. Because a draft release is not publically
# visible, the release needs to be manually reviewed and published.
name: Generate Release
on:
  push:
    tags: "*"

jobs:
  build:
    name: Build
    uses: ./.github/workflows/test.yaml
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    with:
      runs-on: ${{ matrix.os }}
      create-artifact: true

  create-release:
    name: Create release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Prepare application bundles
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Zip artifacts
        run: cd artifacts && for i in */; do zip -r "${i%/}.zip" "$i"; done

      # Generate a release
      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/*.zip
          discussion_category_name: Announcements
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
