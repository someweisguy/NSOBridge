[tool.mypy]
disable_error_code = [
  "prop-decorator", # Prevent errors when using Pydantic's computed_field
  "type-abstract",
]
plugins = ['pydantic.mypy']

[tool.ruff]
fix = true
indent-width = 4
line-length = 88

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
extend-select = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "FAST",
  "PL",
  "EXE",
  "TC", # Put imports in TYPE_CHECKING blocks when possible
]
fixable = ["ALL"]
ignore = [
  "D", # TODO: Remove me when ready to begin documentation
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/api/*.py" = ["B008"] # Ignore use of Query() and Body() in API method arguments

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
