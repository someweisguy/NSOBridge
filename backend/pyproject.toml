[tool.mypy]
disable_error_code = [
  "prop-decorator", # Prevent errors when using Pydantic's computed_field
  "type-abstract",
]
plugins = ['pydantic.mypy']

[tool.ruff]
extend-select = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "FAST",
  "PL",
  "EXE",
  "TC", # Put imports in TYPE_CHECKING blocks when possible
]
fix = true
fixable = ["ALL"]
ignore = [
  "D",  # TODO: Remove me when ready to begin documentation
]
indent-width = 4
line-length = 88
unfixable = []

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.isort]
combine-as-imports = true
force-single-line = false
