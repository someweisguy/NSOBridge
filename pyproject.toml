[project]
dependencies = [
  "aiosqlite~=0.21.0",
  "fastapi~=0.115.12",
  "nanoid~=2.0.0",
  "pyinstaller~=6.12.0",
  "requests~=2.31.0",
  "ruff~=0.12.2",
  "SQLAlchemy~=2.0.41",
  "ty~=0.0.1-alpha.25",
  "uvicorn~=0.34.2",
  "websockets~=15.0.1",
]
name = "nso-bridge"
requires-python = ">=3.13"
version = "0.1.0"

[tool.ruff]
fix = true
indent-width = 4
line-length = 88

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
extend-select = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "FAST",
  "PL",
  "EXE",
  "TC", # Put imports in TYPE_CHECKING blocks when possible
]
fixable = ["ALL"]
ignore = [
  "D", # TODO: Remove me when ready to begin documentation
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"backend/api/*.py" = ["B008"] # Ignore use of Query() and Body() in API method arguments

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ty.environment]
root = ["./backend"]
