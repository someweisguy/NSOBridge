[project]
name = "nso-bridge"
requires-python = ">=3.13"
version = "0.1.0"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.115.14",
    "requests>=2.32.5",
    "ruff>=0.14.10",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.34.3",
    "websockets>=15.0.1",
]

[tool.pyrefly]
project-includes = [
  "**/*.py*",
  "**/*.ipynb",
]
search_path = [
  "backend",
]

[tool.ruff]
indent-width = 4
line-length = 88

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint]
extend-select = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "FAST",
  "PL",
  "EXE",
  "TC", # Put imports in TYPE_CHECKING blocks when possible
]
ignore = [
]

[tool.ruff.lint.extend-per-file-ignores]
"dependencies.py" = [
  "PLR0913", # Dependency methods may have more arguments than typical
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.setuptools.packages.find]
include = [
  "backend",
]
